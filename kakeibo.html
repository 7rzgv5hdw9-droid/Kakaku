<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F3EC">
<title>おこづかい帳</title>
<style>
:root{
  --paper:#F5F3EC;
  --card:#FFFFFF;
  --ink:#2B2E36;
  --muted:#8C8A80;
  --line:#E6E2D6;
  --navy:#33415C;
  --exp:#D9534B;
  --exp-soft:#FBEFEE;
  --inc:#2E9E6B;
  --inc-soft:#EDF7F1;
  --r:14px;
  --shadow:0 1px 3px rgba(43,46,54,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  font-size:15px;line-height:1.5;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.tabpane{display:none;padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
.tabpane.active{display:block}
h2.sec{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:18px 2px 8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}

/* ===== タブバー ===== */
.tabbar{
  display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 6px;font-size:10.5px;color:var(--muted);font-weight:600;
}
.tabbar .ti{width:21px;height:21px;opacity:.5;transition:.15s;stroke-width:1.8}
.tabbar button.active{color:var(--navy)}
.tabbar button.active .ti{opacity:1}

/* ===== ホーム:支出/収入切替 ===== */
.seg{
  display:flex;background:#EAE7DD;border-radius:999px;padding:4px;margin:2px 0 10px;position:relative;
}
.seg button{flex:1;padding:9px 0;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.seg-ind{
  position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);
  background:var(--exp);border-radius:999px;transition:transform .25s cubic-bezier(.4,0,.2,1),background .25s;
}
.seg.inc .seg-ind{transform:translateX(100%);background:var(--inc)}
.seg.exp button.b-exp,.seg.inc button.b-inc{color:#fff}

.swipe-wrap{overflow:hidden;touch-action:pan-y}
.swipe-track{display:flex;width:200%;transform:translateX(0)}
.panel{width:50%;flex-shrink:0;padding:2px 6px 8px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.05em}
.field input[type="date"],.field input[type="text"]{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  -webkit-appearance:none;appearance:none;
}
.field input:focus{outline:none;border-color:var(--navy)}
.amt-wrap{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:4px 12px}
.amt-wrap:focus-within{border-color:var(--navy)}
.amt-wrap .yen{font-size:20px;font-weight:700;color:var(--muted);margin-right:6px}
.amt-wrap input{flex:1;border:none;background:none;font-size:26px;font-weight:700;padding:6px 0;min-width:0;text-align:right}
.amt-wrap input:focus{outline:none}

/* ===== SVGアイコン基本 ===== */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}

/* ===== 選択チップグリッド ===== */
.chip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.chip{
  --c:#999;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 3px 6px;border-radius:12px;background:var(--card);
  border:1.5px solid var(--line);min-height:60px;transition:.12s;
}
.cico{
  width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);font-size:16px;font-weight:700;
}
.cico .ic{width:17px;height:17px}
.chip .cn{font-size:10.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:inset 0 0 0 1px var(--c)}
.chip.sel .cn{color:var(--c);font-weight:800}
.chip.sel::after{
  content:"✓";position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:99px;
  background:var(--c);color:#fff;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);
}
.chip.add{border-style:dashed}
.chip.add .cico{background:#F0EDE4;color:var(--muted)}
.chip.add .cn{color:var(--muted)}

/* ===== 入力上部のコンパクト行 ===== */
.form-top{display:flex;gap:8px;margin-bottom:8px}
.form-top input{
  padding:9px 10px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);
  -webkit-appearance:none;appearance:none;
}
.form-top input[type="date"]{flex:0 0 41%;font-size:14px;padding:9px 7px}
.form-top input[type="text"]{flex:1;min-width:0;font-size:15px}
.form-top input:focus{outline:none;border-color:var(--navy)}
.amt-wrap.compact{margin-bottom:12px}
.amt-wrap.compact input{font-size:23px;padding:5px 0}

.save-btn{
  width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:700;color:#fff;
  margin-top:4px;box-shadow:var(--shadow);transition:transform .1s;
}
.save-btn:active{transform:scale(.98)}
.save-btn.exp{background:var(--exp)}
.save-btn.inc{background:var(--inc)}

/* ===== 月ナビ ===== */
.month-nav{display:flex;align-items:center;justify-content:center;gap:4px;margin:2px 0 12px}
.month-nav button{width:40px;height:40px;font-size:18px;color:var(--navy);font-weight:700;border-radius:12px}
.month-nav button:active{background:#EAE7DD}
.month-nav .mn-label{font-size:18px;font-weight:800;min-width:150px;text-align:center;letter-spacing:.03em}

/* ===== 履歴 ===== */
.sum-strip{display:flex;gap:8px;margin-bottom:12px}
.sum-strip .card{flex:1;padding:10px 8px;text-align:center}
.sum-strip .sl{font-size:11px;font-weight:700;color:var(--muted)}
.sum-strip .sv{font-size:15px;font-weight:800;margin-top:2px;white-space:nowrap}
.sv.exp{color:var(--exp)}.sv.inc{color:var(--inc)}
.day-head{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.tx-list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tx-row{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.tx-row:last-child{border-bottom:none}
.tx-row:active{background:#FAF8F2}
.tx-ic{--c:#999;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);flex-shrink:0}
.tx-ic .ic{width:19px;height:19px}
.tx-main{flex:1;min-width:0}
.tx-name{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-size:15px;font-weight:800;white-space:nowrap}
.tx-amt.exp{color:var(--exp)}.tx-amt.inc{color:var(--inc)}

.empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .ei{display:flex;justify-content:center;margin-bottom:8px;color:#C9C5B8}
.empty .ei .ic{width:36px;height:36px}

/* ===== 分析 ===== */
.bar-row{display:flex;align-items:center;gap:8px;padding:7px 0}
.bar-ic{width:24px;display:flex;justify-content:center;flex-shrink:0}
.bar-ic .ic{width:18px;height:18px}
.bar-main{flex:1;min-width:0}
.bar-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:3px}
.bar-top .bv{font-weight:800;white-space:nowrap;margin-left:8px}
.bar-track{height:8px;border-radius:99px;background:#EFEDE4;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.trend{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.trend-bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.trend-bars i{display:block;width:38%;max-width:16px;border-radius:4px 4px 2px 2px;min-height:2px}
.trend-bars .tb-inc{background:var(--inc)}
.trend-bars .tb-exp{background:var(--exp)}
.trend-lb{font-size:10.5px;color:var(--muted);font-weight:600}
.trend-lb.cur{color:var(--navy);font-weight:800}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:0}
.acc-bal{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.acc-bal:last-child{border-bottom:none}
.acc-bal .ab-amt{margin-left:auto;font-weight:800;font-size:15px}
.ab-amt.minus{color:var(--exp)}

/* ===== 設定 ===== */
.set-list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.set-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row:active{background:#FAF8F2}
.set-row .si{width:26px;display:flex;justify-content:center;color:var(--navy)}
.set-row .si .ic{width:19px;height:19px}
.set-row.danger .si{color:var(--exp)}
.set-row .arrow{margin-left:auto;color:#C9C5B8;font-size:15px}
.set-row.danger{color:var(--exp)}
.set-note{font-size:11.5px;color:var(--muted);margin:6px 4px 0;line-height:1.6}

/* ===== モーダル ===== */
.backdrop{
  position:fixed;inset:0;background:rgba(43,46,54,.45);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.backdrop.show{opacity:1}
.sheet{
  background:var(--paper);width:100%;max-width:560px;max-height:88dvh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  transform:translateY(30px);transition:transform .22s cubic-bezier(.3,0,.2,1);
}
.backdrop.show .sheet{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;padding:14px 16px 10px;flex-shrink:0}
.sheet-head h3{font-size:16.5px;font-weight:800;flex:1}
.sheet-close{width:32px;height:32px;border-radius:99px;background:#EAE7DD;font-size:15px;font-weight:700;color:var(--muted)}
.sheet-body{overflow-y:auto;padding:2px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* 管理リスト */
.mg-item{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:7px;box-shadow:var(--shadow)}
.mg-ic{--c:#999;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);flex-shrink:0}
.mg-ic .ic{width:17px;height:17px}
.mg-name{flex:1;font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.mg-btn{width:32px;height:32px;border-radius:9px;background:#F0EDE4;color:var(--navy);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mg-btn .ic{width:16px;height:16px}
.mg-btn.del{color:var(--exp);background:#FBEFEE}
.mg-handle{width:36px;height:36px;margin-right:-4px;display:flex;align-items:center;justify-content:center;color:#C9C5B8;touch-action:none;cursor:grab;flex-shrink:0}
.mg-handle .ic{width:20px;height:20px;stroke-width:2}
.mg-item{transition:box-shadow .15s}
.mg-item.dragging{opacity:.92;box-shadow:0 8px 20px rgba(43,46,54,.28);position:relative;z-index:5;cursor:grabbing}
.mg-add-btn{
  width:100%;padding:12px;border:1.5px dashed #C9C5B8;border-radius:12px;color:var(--muted);
  font-weight:700;font-size:14px;margin:4px 0 10px;
}
.mg-form{background:var(--card);border-radius:14px;padding:14px;margin:4px 0 12px;box-shadow:var(--shadow)}
.mg-form h4{font-size:13.5px;font-weight:800;margin-bottom:10px}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.emoji-grid button{display:flex;align-items:center;justify-content:center;padding:8px 0;border-radius:9px;color:#6B7280}
.emoji-grid .ic{width:20px;height:20px}
.emoji-grid button.sel{background:#EAE7DD;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.color-grid button{height:32px;border-radius:10px;position:relative}
.color-grid button.sel::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.mg-form-actions{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:14.5px}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:#EFEDE4;color:var(--muted)}
.btn.danger-outline{background:#FBEFEE;color:var(--exp)}
.preview-chip .ic{width:16px;height:16px;color:var(--c)}
.preview-chip{display:inline-flex;align-items:center;gap:6px;--c:#999;background:color-mix(in srgb,var(--c) 14%,#fff);border:1.5px solid var(--c);border-radius:99px;padding:5px 14px;font-weight:700;font-size:13px;margin-bottom:12px}

/* 記録編集モーダル */
.edit-type-badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 12px;border-radius:99px;color:#fff;margin-bottom:10px}
.edit-type-badge.exp{background:var(--exp)}
.edit-type-badge.inc{background:var(--inc)}

/* トースト */
#toast{
  position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;
  padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:99;
  white-space:nowrap;box-shadow:0 4px 14px rgba(43,46,54,.3);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:520px){
  .chip-grid{grid-template-columns:repeat(5,1fr)}
  main{max-width:560px;width:100%;margin:0 auto}
  .tabbar{max-width:560px;width:100%;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<script>
/* ================= データ管理 ================= */
const KEY = 'kakeibo-v1';
let memOnly = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const ICON_KEYS = [
  'wallet','bank','card','coin','cash','phone','laptop',
  'onigiri','bowl','bread','apple','coffee','beer','cake',
  'cart','basket','bulb','plug','wifi','droplet','home',
  'train','bus','car','bike','fuel','plane',
  'game','film','music','book','ball','dumbbell','brush','mountain','camera','ticket',
  'shirt','scissors','sparkle','pill','hospital','paw','sun',
  'gift','briefcase','mail','calendar','gradcap','chart','pen','tool','box','tag','star','heart',
];
const ICON_SET = new Set(ICON_KEYS);
const UI_ICONS = new Set(['help','grip','trash','download','upload','sliders']);
function icg(key){
  return '<svg class="ic"><use href="#i-' + (ICON_SET.has(key) || UI_ICONS.has(key) ? key : 'tag') + '"/></svg>';
}
const EMOJI_MAP = {'👛':'wallet','🏦':'bank','🍚':'onigiri','🧻':'basket','🚃':'train','🎮':'game','🍻':'beer','👕':'shirt','💊':'pill','🏠':'home','📦':'box','💼':'briefcase','🎁':'gift','🪙':'coin'};
function migrate(st){
  ['accounts','expCats','incCats'].forEach(k => (st[k] || []).forEach(it => {
    if(!ICON_SET.has(it.icon)) it.icon = EMOJI_MAP[it.icon] || 'tag';
  }));
  return st;
}

function defaultState(){
  return {
    accounts: [
      {id:uid(), name:'財布', icon:'wallet', color:'#E2A33C'},
      {id:uid(), name:'銀行', icon:'bank', color:'#4A6DB5'},
    ],
    expCats: [
      {id:uid(), name:'食費',   icon:'onigiri', color:'#E05252'},
      {id:uid(), name:'日用品', icon:'basket', color:'#E2823C'},
      {id:uid(), name:'交通費', icon:'train', color:'#4A90B5'},
      {id:uid(), name:'趣味',   icon:'game', color:'#7B61C4'},
      {id:uid(), name:'交際費', icon:'beer', color:'#E2A33C'},
      {id:uid(), name:'衣服',   icon:'shirt', color:'#C45C9E'},
      {id:uid(), name:'医療',   icon:'pill', color:'#3FA36C'},
      {id:uid(), name:'住まい', icon:'home', color:'#8B7355'},
      {id:uid(), name:'その他', icon:'box', color:'#6B7280'},
    ],
    incCats: [
      {id:uid(), name:'給料',     icon:'briefcase', color:'#2E9E6B'},
      {id:uid(), name:'ボーナス', icon:'gift', color:'#E2A33C'},
      {id:uid(), name:'おこづかい', icon:'coin', color:'#4A90B5'},
      {id:uid(), name:'その他',   icon:'box', color:'#6B7280'},
    ],
    txs: [],
  };
}

function loadState(){
  try{
    const s = localStorage.getItem(KEY);
    return s ? JSON.parse(s) : null;
  }catch(e){ memOnly = true; return null; }
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ memOnly = true; }
}

let state = migrate(loadState() || defaultState());
saveState();

/* ================= ユーティリティ ================= */
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const WD = ['日','月','火','水','木','金','土'];
function dateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const w = WD[new Date(y, m-1, d).getDay()];
  return m + '月' + d + '日（' + w + '）';
}
function listOf(kind){
  return kind === 'accounts' ? state.accounts : kind === 'expCats' ? state.expCats : state.incCats;
}
function findItem(list, id){ return list.find(x => x.id === id); }
function catList(type){ return type === 'exp' ? state.expCats : state.incCats; }
const MISSING = {name:'（削除済み）', icon:'help', color:'#9CA3AF'};

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* 月カーソル（履歴・分析共通） */
let cur = (() => { const d = new Date(); return {y: d.getFullYear(), m: d.getMonth()+1}; })();
function monthShift(delta){
  let m = cur.m + delta, y = cur.y;
  while(m < 1){ m += 12; y--; }
  while(m > 12){ m -= 12; y++; }
  cur = {y, m};
}
function inMonth(tx, y, m){
  const [ty, tm] = tx.date.split('-').map(Number);
  return ty === y && tm === m;
}
</script>
<script>
/* ================= ホーム（入力） ================= */
const sel = { exp: {cat: null, acc: null}, inc: {cat: null, acc: null} };

function ensureSelections(){
  ['exp','inc'].forEach(type => {
    // 口座：一番手前（先頭）を自動選択
    if(!findItem(state.accounts, sel[type].acc)){
      sel[type].acc = state.accounts.length ? state.accounts[0].id : null;
    }
    if(!findItem(catList(type), sel[type].cat)) sel[type].cat = null;
  });
}

function chipGridHTML(items, selectedId, dataKind, dataType){
  let h = items.map(it =>
    '<button type="button" class="chip' + (it.id === selectedId ? ' sel' : '') + '" style="--c:' + it.color + '" ' +
    'data-pick="' + dataKind + '" data-type="' + dataType + '" data-id="' + it.id + '">' +
    '<span class="cico">' + icg(it.icon) + '</span><span class="cn">' + esc(it.name) + '</span></button>'
  ).join('');
  h += '<button type="button" class="chip add" data-manage="' + (dataKind === 'acc' ? 'accounts' : (dataType === 'exp' ? 'expCats' : 'incCats')) + '">' +
       '<span class="cico">＋</span><span class="cn">追加・編集</span></button>';
  return h;
}

function renderPanel(type){
  ensureSelections();
  const isExp = type === 'exp';
  const panel = $(isExp ? 'panel-exp' : 'panel-inc');
  const keepDate = panel.querySelector('[data-f="date"]');
  const keepName = panel.querySelector('[data-f="name"]');
  const keepAmt  = panel.querySelector('[data-f="amt"]');
  const dateVal = keepDate ? keepDate.value : todayISO();
  const nameVal = keepName ? keepName.value : '';
  const amtVal  = keepAmt ? keepAmt.value : '';

  panel.innerHTML =
    '<div class="form-top">' +
    '<input type="date" data-f="date" value="' + dateVal + '" aria-label="日付">' +
    '<input type="text" data-f="name" placeholder="項目名" value="' + esc(nameVal) + '" aria-label="項目名">' +
    '</div>' +

    '<div class="amt-wrap compact"><span class="yen">¥</span>' +
    '<input type="text" inputmode="numeric" data-f="amt" placeholder="0" value="' + esc(amtVal) + '" aria-label="' + (isExp ? '支出金額' : '収入金額') + '"></div>' +

    '<div class="field"><label>カテゴリ</label>' +
    '<div class="chip-grid">' + chipGridHTML(catList(type), sel[type].cat, 'cat', type) + '</div></div>' +

    '<div class="field"><label>使用口座</label>' +
    '<div class="chip-grid">' + chipGridHTML(state.accounts, sel[type].acc, 'acc', type) + '</div></div>' +

    '<button type="button" class="save-btn ' + type + '" data-save="' + type + '">' +
    (isExp ? '支出を記録する' : '収入を記録する') + '</button>';
}

function renderHome(){
  renderPanel('exp');
  renderPanel('inc');
}

/* 金額入力：数字以外を除去しカンマ表示 */
document.addEventListener('input', e => {
  if(e.target.matches('[data-f="amt"]')){
    const digits = e.target.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g,'').slice(0,10);
    e.target.value = digits ? Number(digits).toLocaleString('ja-JP') : '';
  }
});
function readAmt(input){ return Number((input.value||'').replace(/[^0-9]/g,'')) || 0; }

/* チップ選択・追加・保存（イベント委譲） */
document.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if(pick){
    const {pick: kind, type, id} = pick.dataset;
    if(pick.closest('#modal-root')){
      // 編集モーダル内の選択
      if(kind === 'cat') editSel.cat = id; else editSel.acc = id;
      renderEditGrids();
    }else{
      sel[type][kind] = id;
      renderPanel(type);
    }
    return;
  }
  const mng = e.target.closest('[data-manage]');
  if(mng){ openManager(mng.dataset.manage); return; }

  const sv = e.target.closest('[data-save]');
  if(sv){ saveTx(sv.dataset.save); return; }
});

function saveTx(type){
  const panel = $(type === 'exp' ? 'panel-exp' : 'panel-inc');
  const date = panel.querySelector('[data-f="date"]').value;
  const name = panel.querySelector('[data-f="name"]').value.trim();
  const amount = readAmt(panel.querySelector('[data-f="amt"]'));

  if(!date){ toast('日付を入力してください'); return; }
  if(!amount){ toast('金額を入力してください'); return; }
  if(!sel[type].cat){ toast('カテゴリを選択してください'); return; }
  if(!sel[type].acc){ toast('使用口座を選択してください'); return; }

  state.txs.push({
    id: uid(), type, date, name, amount,
    catId: sel[type].cat, accId: sel[type].acc, ts: Date.now(),
  });
  saveState();
  panel.querySelector('[data-f="name"]').value = '';
  panel.querySelector('[data-f="amt"]').value = '';
  toast((type === 'exp' ? '支出' : '収入') + 'を記録しました');
}

/* ================= スワイプ切替 ================= */
let homeIdx = 0;
const track = $('swipeTrack');
const wrap = $('swipeWrap');

function setHome(idx, animate = true){
  homeIdx = idx;
  track.style.transition = animate ? 'transform .25s cubic-bezier(.3,0,.2,1)' : 'none';
  track.style.transform = 'translateX(' + (-idx * 50) + '%)';
  $('seg').classList.toggle('exp', idx === 0);
  $('seg').classList.toggle('inc', idx === 1);
}
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-idx]');
  if(b) setHome(Number(b.dataset.idx));
});

let tch = null;
wrap.addEventListener('touchstart', e => {
  tch = {x: e.touches[0].clientX, y: e.touches[0].clientY, lock: null, dx: 0};
}, {passive: true});
wrap.addEventListener('touchmove', e => {
  if(!tch) return;
  const dx = e.touches[0].clientX - tch.x;
  const dy = e.touches[0].clientY - tch.y;
  if(tch.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
    tch.lock = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if(tch.lock === 'h') track.style.transition = 'none';
  }
  if(tch.lock === 'h'){
    e.preventDefault();
    tch.dx = dx;
    let off = -homeIdx * 50 + (dx / wrap.clientWidth) * 50;
    off = Math.max(-50, Math.min(0, off));
    track.style.transform = 'translateX(' + off + '%)';
  }
}, {passive: false});
wrap.addEventListener('touchend', () => {
  if(!tch) return;
  if(tch.lock === 'h'){
    let idx = homeIdx;
    if(tch.dx < -50) idx = 1;
    if(tch.dx > 50) idx = 0;
    setHome(idx);
  }
  tch = null;
});

/* ================= 履歴 ================= */
function monthNavHTML(idPrefix){
  return '<div class="month-nav">' +
    '<button data-mnav="-1">‹</button>' +
    '<span class="mn-label">' + cur.y + '年' + cur.m + '月</span>' +

}
document.addEventListener('click', e => {

  if(!b) return;
  monthShift(Number(b.dataset.mnav));
  renderHistory();
  renderAnalysis();
});

function monthTotals(y, m){
  let inc = 0, exp = 0;
  state.txs.forEach(t => {
    if(inMonth(t, y, m)){
      if(t.type === 'inc') inc += t.amount; else exp += t.amount;
    }
  });
  return {inc, exp};
}

function txRowHTML(t){
  const cat = findItem(catList(t.type), t.catId) || MISSING;
  const acc = findItem(state.accounts, t.accId) || MISSING;
  const title = t.name || cat.name;
  return '<button type="button" class="tx-row" data-edit-tx="' + t.id + '">' +
    '<span class="tx-ic" style="--c:' + cat.color + '">' + icg(cat.icon) + '</span>' +
    '<span class="tx-main"><span class="tx-name">' + esc(title) + '</span>' +
    '<span class="tx-sub">' + esc(cat.name) + ' ・ ' + esc(acc.name) + '</span></span>' +
    '<span class="tx-amt ' + t.type + '">' + (t.type === 'exp' ? '−' : '+') + fmt(t.amount) + '</span></button>';
}

function renderHistory(){
  const pane = $('tab-history');
  const {inc, exp} = monthTotals(cur.y, cur.m);
  const bal = inc - exp;
  const txs = state.txs.filter(t => inMonth(t, cur.y, cur.m))
    .sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts);

  let listHTML = '';
  if(!txs.length){
    listHTML = '<div class="card empty"><span class="ei">' + icg('book') + '</span>この月の記録はまだありません<br>「入力」タブから記録してみましょう</div>';
  }else{
    const byDate = {};
    txs.forEach(t => (byDate[t.date] = byDate[t.date] || []).push(t));
    Object.keys(byDate).sort((a,b) => b.localeCompare(a)).forEach(d => {
      const dayExp = byDate[d].reduce((s,t) => s + (t.type === 'exp' ? t.amount : 0), 0);
      listHTML += '<div class="day-head"><span>' + dateLabel(d) + '</span>' +
        (dayExp ? '<span>支出 ' + fmt(dayExp) + '</span>' : '') + '</div>' +
        '<div class="tx-list">' + byDate[d].map(txRowHTML).join('') + '</div>';
    });
  }

  pane.innerHTML = monthNavHTML() +
    '<div class="sum-strip">' +
    '<div class="card"><div class="sl">収入</div><div class="sv inc">' + fmt(inc) + '</div></div>' +
    '<div class="card"><div class="sl">支出</div><div class="sv exp">' + fmt(exp) + '</div></div>' +
    '<div class="card"><div class="sl">収支</div><div class="sv" style="color:' + (bal < 0 ? 'var(--exp)' : 'var(--navy)') + '">' + (bal < 0 ? '−' : '') + fmt(Math.abs(bal)) + '</div></div>' +
    '</div>' + listHTML;
}
document.addEventListener('click', e => {

<script>
/* ================= 分析 ================= */
function breakdownHTML(type){
  const y = cur.y, m = cur.m;
  const map = {};
  let total = 0;
  state.txs.forEach(t => {
    if(t.type === type && inMonth(t, y, m)){
      map[t.catId] = (map[t.catId] || 0) + t.amount;
      total += t.amount;
    }
  });
  if(!total) return '<div class="empty" style="padding:20px">この月の' + (type === 'exp' ? '支出' : '収入') + 'はありません</div>';
  const rows = Object.entries(map).sort((a,b) => b[1] - a[1]).map(([catId, amt]) => {
    const cat = findItem(catList(type), catId) || MISSING;
    const pct = Math.round(amt / total * 100);
    return '<div class="bar-row"><span class="bar-ic" style="color:' + cat.color + '">' + icg(cat.icon) + '</span>' +
      '<span class="bar-main"><span class="bar-top"><span>' + esc(cat.name) + '（' + pct + '%）</span>' +
      '<span class="bv">' + fmt(amt) + '</span></span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + Math.max(pct,2) + '%;background:' + cat.color + '"></span></span>' +
      '</span></div>';
  }).join('');
  return rows;
}

function trendHTML(){
  const months = [];
  for(let i = 5; i >= 0; i--){
    let m = cur.m - i, y = cur.y;
    while(m < 1){ m += 12; y--; }
    months.push({y, m, ...monthTotals(y, m)});
  }
  const max = Math.max(1, ...months.map(x => Math.max(x.inc, x.exp)));
  const cols = months.map((x, i) => {
    const hi = Math.round(x.inc / max * 100);
    const he = Math.round(x.exp / max * 100);
    const isCur = i === 5;
    return '<div class="trend-col"><div class="trend-bars">' +
      '<i class="tb-inc" style="height:' + hi + '%"></i>' +
      '<i class="tb-exp" style="height:' + he + '%"></i></div>' +
      '<span class="trend-lb' + (isCur ? ' cur' : '') + '">' + x.m + '月</span></div>';
  }).join('');
  return '<div class="trend">' + cols + '</div>' +
    '<div class="legend"><span><i style="background:var(--inc)"></i>収入</span>' +
    '<span><i style="background:var(--exp)"></i>支出</span></div>';
}

function accountBalanceHTML(){
  if(!state.accounts.length) return '<div class="empty" style="padding:20px">口座が登録されていません</div>';
  return state.accounts.map(a => {
    let bal = 0;
    state.txs.forEach(t => {
      if(t.accId === a.id) bal += (t.type === 'inc' ? t.amount : -t.amount);
    });
    return '<div class="acc-bal"><span class="mg-ic" style="--c:' + a.color + '">' + icg(a.icon) + '</span>' +
      '<span style="font-weight:700;font-size:14px">' + esc(a.name) + '</span>' +
      '<span class="ab-amt' + (bal < 0 ? ' minus' : '') + '">' + (bal < 0 ? '−' : '') + fmt(Math.abs(bal)) + '</span></div>';
  }).join('');
}

function renderAnalysis(){
  const {inc, exp} = monthTotals(cur.y, cur.m);
  const bal = inc - exp;
  $('tab-analysis').innerHTML = monthNavHTML() +
    '<div class="sum-strip">' +
    '<div class="card"><div class="sl">収入</div><div class="sv inc">' + fmt(inc) + '</div></div>' +
    '<div class="card"><div class="sl">支出</div><div class="sv exp">' + fmt(exp) + '</div></div>' +
    '<div class="card"><div class="sl">収支</div><div class="sv" style="color:' + (bal < 0 ? 'var(--exp)' : 'var(--navy)') + '">' + (bal < 0 ? '−' : '') + fmt(Math.abs(bal)) + '</div></div>' +
    '</div>' +
    '<h2 class="sec">支出の内訳</h2><div class="card">' + breakdownHTML('exp') + '</div>' +
    '<h2 class="sec">収入の内訳</h2><div class="card">' + breakdownHTML('inc') + '</div>' +
    '<h2 class="sec">6ヶ月の推移</h2><div class="card">' + trendHTML() + '</div>' +
    '<h2 class="sec">口座残高（全期間）</h2><div class="card">' + accountBalanceHTML() + '</div>';
}

/* ================= モーダル基盤 ================= */

/* ================= カテゴリ・口座 管理 ================= */
const EMOJIS = ICON_KEYS;
const COLORS = ['#E05252','#E2823C','#E2A33C','#8FA83B','#3FA36C','#2E9E8E','#4A90B5','#4A6DB5','#7B61C4','#C45C9E','#8B7355','#6B7280'];
const KIND_LABEL = {accounts:'口座', expCats:'支出カテゴリ', incCats:'収入カテゴリ'};

let mgr = null; // {kind, mode:'list'|'form', editId, form:{name,icon,color}}

function openManager(kind){
  mgr = {kind, mode:'list', editId:null, form:null};
  openSheet(KIND_LABEL[kind] + 'の管理', '');
  renderManager();
}

function renderManager(){
  const body = $('sheet-body');
  if(!body || !mgr) return;
  const list = listOf(mgr.kind);

  if(mgr.mode === 'form'){
    const f = mgr.form;
    body.innerHTML =
      '<div class="mg-form"><h4>' + (mgr.editId ? KIND_LABEL[mgr.kind] + 'を編集' : '新しい' + KIND_LABEL[mgr.kind] + 'を追加') + '</h4>' +
      '<div class="preview-chip" style="--c:' + f.color + '">' + icg(f.icon) + '<span>' + esc(f.name || '名前未入力') + '</span></div>' +
      '<div class="field"><label>名前</label>' +
      '<input type="text" id="mg-name" maxlength="12" placeholder="例：' + (mgr.kind === 'accounts' ? 'PayPay' : 'ペット') + '" value="' + esc(f.name) + '"></div>' +
      '<label style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px">アイコン</label>' +
      '<div class="emoji-grid">' + EMOJIS.map(em =>
        '<button type="button" data-emoji="' + em + '"' + (em === f.icon ? ' class="sel"' : '') + '>' + icg(em) + '</button>').join('') + '</div>' +
      '<label style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px">カラー</label>' +
      '<div class="color-grid">' + COLORS.map(c =>
        '<button type="button" data-color="' + c + '" style="background:' + c + '"' + (c === f.color ? ' class="sel"' : '') + '></button>').join('') + '</div>' +
      '<div class="mg-form-actions">' +
      '<button type="button" class="btn ghost" data-mg-cancel>キャンセル</button>' +
      '<button type="button" class="btn primary" data-mg-save>' + (mgr.editId ? '更新する' : '追加する') + '</button>' +
      '</div>' +
      (mgr.editId ? '<button type="button" class="btn danger-outline" style="width:100%;margin-top:8px" data-mg-del="' + mgr.editId + '">この' + KIND_LABEL[mgr.kind] + 'を削除する</button>' : '') +
      '</div>';
    return;
  }

  let h = '<button type="button" class="mg-add-btn" data-mg-add>＋ 新しく追加する</button>';
  if(!list.length){
    h += '<div class="empty" style="padding:24px">まだ登録がありません</div>';
  }else{
    h += '<div id="mg-list">' + list.map(it =>
      '<div class="mg-item" data-id="' + it.id + '">' +
      '<span class="mg-ic" style="--c:' + it.color + '">' + icg(it.icon) + '</span>' +
      '<button type="button" class="mg-name" data-mg-edit="' + it.id + '">' + esc(it.name) + '</button>' +
      '<button type="button" class="mg-btn del" data-mg-del="' + it.id + '">' + icg('trash') + '</button>' +
      '<span class="mg-handle">' + icg('grip') + '</span>' +
      '</div>').join('') + '</div>';
    h += '<p class="set-note">名前をタップで編集、右端の「≡」を掴んでドラッグすると並び替えできます。' +
      (mgr.kind === 'accounts' ? '一番上の口座が入力画面で自動選択されます。' : '') + '</p>';
  }
  body.innerHTML = h;
}

document.addEventListener('click', e => {
  if(!mgr || !e.target.closest('#modal-root')) return;

  if(e.target.closest('[data-mg-add]')){
    mgr.mode = 'form'; mgr.editId = null;
    mgr.form = {name:'', icon: EMOJIS[0], color: COLORS[Math.floor(Math.random()*COLORS.length)]};
    renderManager(); return;
  }
  const ed = e.target.closest('[data-mg-edit]');
  if(ed){
    const it = findItem(listOf(mgr.kind), ed.dataset.mgEdit);
    if(it){ mgr.mode = 'form'; mgr.editId = it.id; mgr.form = {name: it.name, icon: it.icon, color: it.color}; renderManager(); }
    return;
  }
  const del = e.target.closest('[data-mg-del]');
  if(del){
    const id = del.dataset.mgDel;
    const it = findItem(listOf(mgr.kind), id);
    if(!it) return;
    const used = state.txs.filter(t => t.catId === id || t.accId === id).length;
    const msg = used
      ? '「' + it.name + '」を削除しますか？\nこれを使った記録が' + used + '件あり、削除後は「（削除済み）」と表示されます。'
      : '「' + it.name + '」を削除しますか？';
    if(confirm(msg)){
      const list = listOf(mgr.kind);
      list.splice(list.findIndex(x => x.id === id), 1);
      mgr.mode = 'list'; mgr.editId = null;
      saveState(); renderManager(); renderHome();
      toast('削除しました');
    }
    return;
  }
  const em = e.target.closest('[data-emoji]');
  if(em && mgr.form){ mgr.form.name = ($('mg-name')||{}).value ?? mgr.form.name; mgr.form.icon = em.dataset.emoji; renderManager(); return; }
  const co = e.target.closest('[data-color]');
  if(co && mgr.form){ mgr.form.name = ($('mg-name')||{}).value ?? mgr.form.name; mgr.form.color = co.dataset.color; renderManager(); return; }

  if(e.target.closest('[data-mg-cancel]')){ mgr.mode = 'list'; renderManager(); return; }

  if(e.target.closest('[data-mg-save]')){
    const name = ($('mg-name').value || '').trim();
    if(!name){ toast('名前を入力してください'); return; }
    mgr.form.name = name;
    const list = listOf(mgr.kind);
    if(mgr.editId){
      const it = findItem(list, mgr.editId);
      if(it){ it.name = name; it.icon = mgr.form.icon; it.color = mgr.form.color; }
      toast('更新しました');
    }else{
      list.push({id: uid(), name, icon: mgr.form.icon, color: mgr.form.color});
      toast('追加しました');
    }
    saveState();
    mgr.mode = 'list'; mgr.editId = null;
    renderManager(); renderHome();
    return;
  }
});

<script>
/* ================= 並び替えドラッグ ================= */
let drag = null;
function dragStart(e, isTouch){
  const h = e.target.closest('.mg-handle');
  if(!h || !mgr) return;
  const item = h.closest('.mg-item');
  if(!item) return;
  if(isTouch) e.preventDefault();
  drag = {item, listEl: item.parentElement};
  item.classList.add('dragging');
}
function dragMove(y){
  const others = [...drag.listEl.querySelectorAll('.mg-item:not(.dragging)')];
  let before = null;
  for(const el of others){
    const r = el.getBoundingClientRect();
    if(y < r.top + r.height / 2){ before = el; break; }
  }
  if(before) drag.listEl.insertBefore(drag.item, before);
  else drag.listEl.appendChild(drag.item);
}
function dragEnd(){
  if(!drag) return;
  drag.item.classList.remove('dragging');
  const ids = [...drag.listEl.querySelectorAll('.mg-item')].map(el => el.dataset.id);
  const list = listOf(mgr.kind);
  list.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  drag = null;
  saveState();
  renderManager();
  renderHome();
}
document.addEventListener('touchstart', e => dragStart(e, true), {passive: false});
document.addEventListener('touchmove', e => { if(drag){ e.preventDefault(); dragMove(e.touches[0].clientY); } }, {passive: false});
document.addEventListener('touchend', dragEnd);
document.addEventListener('touchcancel', dragEnd);
document.addEventListener('mousedown', e => dragStart(e, false));
document.addEventListener('mousemove', e => { if(drag) dragMove(e.clientY); });
document.addEventListener('mouseup', dragEnd);

/* ================= 記録の編集 ================= */
let editSel = {cat: null, acc: null};
let editingTxId = null;

function openEditTx(id){
  const t = state.txs.find(x => x.id === id);
  if(!t) return;
  editingTxId = id;
  editSel = {cat: t.catId, acc: t.accId};
  openSheet('記録の編集',
    '<span class="edit-type-badge ' + t.type + '">' + (t.type === 'exp' ? '支出' : '収入') + '</span>' +
    '<div class="field"><label>日付</label><input type="date" id="ed-date" value="' + t.date + '"></div>' +
    '<div class="field"><label>項目名</label><input type="text" id="ed-name" value="' + esc(t.name) + '"></div>' +
    '<div class="field"><label>金額</label><div class="amt-wrap"><span class="yen">¥</span>' +
    '<input type="text" inputmode="numeric" data-f="amt" id="ed-amt" value="' + Number(t.amount).toLocaleString('ja-JP') + '"></div></div>' +
    '<div class="field"><label>カテゴリ</label><div class="chip-grid" id="ed-cat-grid"></div></div>' +
    '<div class="field"><label>使用口座</label><div class="chip-grid" id="ed-acc-grid"></div></div>' +
    '<div class="mg-form-actions" style="margin-top:6px">' +
    '<button type="button" class="btn danger-outline" data-ed-del>削除する</button>' +
    '<button type="button" class="btn primary" data-ed-save>保存する</button></div>'
  );
  renderEditGrids();
}

function renderEditGrids(){
  const t = state.txs.find(x => x.id === editingTxId);
  if(!t || !$('ed-cat-grid')) return;
  $('ed-cat-grid').innerHTML = chipGridHTML(catList(t.type), editSel.cat, 'cat', t.type);
  $('ed-acc-grid').innerHTML = chipGridHTML(state.accounts, editSel.acc, 'acc', t.type);
}

document.addEventListener('click', e => {
  if(e.target.closest('[data-ed-save]')){
    const t = state.txs.find(x => x.id === editingTxId);
    if(!t) return;
    const date = $('ed-date').value;
    const amount = readAmt($('ed-amt'));
    if(!date){ toast('日付を入力してください'); return; }
    if(!amount){ toast('金額を入力してください'); return; }
    if(!editSel.cat){ toast('カテゴリを選択してください'); return; }
    if(!editSel.acc){ toast('使用口座を選択してください'); return; }
    t.date = date;
    t.name = $('ed-name').value.trim();
    t.amount = amount;
    t.catId = editSel.cat;
    t.accId = editSel.acc;
    saveState(); closeSheet();
    renderHistory(); renderAnalysis();
    toast('保存しました');
    return;
  }
  if(e.target.closest('[data-ed-del]')){
    if(confirm('この記録を削除しますか？')){
      state.txs = state.txs.filter(x => x.id !== editingTxId);
      saveState(); closeSheet();
      renderHistory(); renderAnalysis();
      toast('削除しました');
    }
  }
});

/* ================= 設定・バックアップ ================= */
function renderSettings(){
  $('tab-settings').innerHTML =
    '<h2 class="sec">登録内容の管理</h2>' +
    '<div class="set-list">' +
    '<button type="button" class="set-row" data-manage="accounts"><span class="si">' + icg('wallet') + '</span>口座の管理<span class="arrow">›</span></button>' +
    '<button type="button" class="set-row" data-manage="expCats"><span class="si">' + icg('cart') + '</span>支出カテゴリの管理<span class="arrow">›</span></button>' +
    '<button type="button" class="set-row" data-manage="incCats"><span class="si">' + icg('briefcase') + '</span>収入カテゴリの管理<span class="arrow">›</span></button>' +
    '</div>' +
    '<h2 class="sec">バックアップ</h2>' +
    '<div class="set-list">' +
    '<button type="button" class="set-row" data-backup><span class="si">' + icg('download') + '</span>バックアップを保存<span class="arrow">›</span></button>' +
    '<button type="button" class="set-row" data-restore><span class="si">' + icg('upload') + '</span>バックアップから復元<span class="arrow">›</span></button>' +
    '</div>' +
    '<p class="set-note">データはこの端末のブラウザ内に自動保存されます。機種変更やブラウザの履歴削除に備えて、定期的にバックアップファイル（JSON）を保存しておくのがおすすめです。' +
    (memOnly ? '<br><b style="color:var(--exp)">⚠️ 現在ブラウザ保存が使えない環境のため、閉じるとデータが消えます。バックアップ保存をご利用ください。</b>' : '') +
    '</p>' +
    '<h2 class="sec">データ</h2>' +
    '<div class="set-list">' +
    '<button type="button" class="set-row danger" data-wipe><span class="si">' + icg('trash') + '</span>すべてのデータを削除</button>' +
    '</div>' +
    '<p class="set-note" style="text-align:center;margin-top:24px">おこづかい帳 v1.0<br>記録件数：' + state.txs.length + '件</p>' +
    '<input type="file" id="restore-file" accept=".json,application/json" style="display:none">';
}

document.addEventListener('click', e => {
  if(e.target.closest('[data-backup]')){
    const payload = {app:'kakeibo', version:1, exportedAt:new Date().toISOString(), data:state};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kakeibo-backup-' + todayISO().replace(/-/g,'') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('バックアップを保存しました');
    return;
  }
  if(e.target.closest('[data-restore]')){ $('restore-file').click(); return; }
  if(e.target.closest('[data-wipe]')){
    if(confirm('すべての記録・カテゴリ・口座を削除して初期状態に戻します。よろしいですか？') &&
       confirm('本当に削除しますか？この操作は取り消せません。')){
      state = defaultState();
      saveState();
      renderAll();
      toast('初期化しました');
    }
  }
});

document.addEventListener('change', e => {
  if(e.target.id !== 'restore-file') return;
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const json = JSON.parse(reader.result);
      const d = json.data && json.data.txs ? json.data : json;
      if(!Array.isArray(d.accounts) || !Array.isArray(d.expCats) || !Array.isArray(d.incCats) || !Array.isArray(d.txs)){
        throw new Error('format');
      }
      if(!confirm('現在のデータをバックアップの内容（記録' + d.txs.length + '件）で置き換えます。よろしいですか？')) return;
      state = migrate(d);
      saveState();
      renderAll();
      toast('復元しました');
    }catch(err){
      toast('ファイルを読み込めませんでした');
    }
  };
  reader.readAsText(file);
});

/* ================= タブ切替・初期化 ================= */
$('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if(!b) return;
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tabpane').forEach(p => p.classList.remove('active'));
  $('tab-' + b.dataset.tab).classList.add('active');
  if(b.dataset.tab === 'history') renderHistory();
  if(b.dataset.tab === 'analysis') renderAnalysis();
  if(b.dataset.tab === 'settings') renderSettings();
  $('main').scrollTop = 0;
});

function renderAll(){
  ensureSelections();
  renderHome();
  renderHistory();
  renderAnalysis();
  renderSettings();
}

renderAll();
setHome(0, false);
</script>
</body>
</html>
